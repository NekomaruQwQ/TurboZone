# M1 accepts the full Rule and StringMatcher shapes documented in
# M1-Plan-config.d.ts. Bare strings are exact and all configured constraints
# within one rule are ANDed.

[[rules]]
name = "vscode.main"
description = "  VS Code (Main Projects)  " # trimmed while loading

move = true # equivalent to "center"

# Complete resize settings enable a primary action and filter selector choices.
resize.enabled = true
resize.target_width = 1440
resize.target_height = 900
resize.min_width = 960
resize.min_height = 540
resize.max_width = 3840
resize.max_height = 2400

match.priority = 10
match.executable.name = "Code.exe" # exact and case-insensitive
match.window.title.ends_with = "Visual Studio Code"
match.window.min_size = [640, 480]
match.window.max_size = [7680, 4320]

[[rules]]
name = "tool.selector-only"
description = "Tool Windows"

move = "center"
resize = true # selector enabled without a configured primary target

match.priority = 20
match.executable.path.exact = "C:/Apps/Tool/tool.exe"
match.window.title.starts_with = "Tool"
match.window.title.contains = "Properties"

[[rules]]
name = "tool.read-only"
description = "Tool Window (Read Only)"

# Omitted actions make this an intentional read-only section.
match.priority = 30
match.executable.name = "tool.exe"
match.window.title = "Tool Diagnostics"

# An object may keep selector limits while resizing is disabled.
# An incomplete target_width/target_height pair produces a warning and both
# target dimensions are ignored.
#
# StringMatcherV2 regex and glob objects remain reserved and are rejected by M1.
