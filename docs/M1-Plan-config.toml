# M1 accepts ConfigRule and Pattern from M1-Plan-config.d.ts.
# Strings are exact; all constraints within one rule are ANDed.
# Sizes are [width, height] arrays of positive physical-pixel integers.

[[rules]]
name = "vscode.main"
description = "  VS Code (Main Projects)  " # trimmed while loading

relocate = true
# Selector mode: a primary target plus independently bounded menu choices.
resize.default = [1440, 900]
resize.min = [960, 540]
resize.max = [3840, 2400]

priority = 10
program.name = "Code.exe" # exact and case-insensitive
window.title.ends_with = "Visual Studio Code"
window.min = [640, 480]
window.max = [7680, 4320]

[[rules]]
name = "tool.selector-only"
description = "Tool Windows"

relocate = true
resize = true # unbounded selector, without a primary target; {} is equivalent

priority = 20
program.path = "C:/Apps/Tool/tool.exe"
window.title.starts_with = "Tool"
window.title.contains = "Properties"

[[rules]]
name = "tool.exact"
description = "Tool Preview"

# Exact mode offers only this target, with no size selector.
resize.exact = [1280, 720]
priority = 25
program.name = "tool.exe"
window.title = "Tool Preview"

[[rules]]
name = "tool.read-only"
description = "Tool Window (Read Only)"

# Both actions default to false. This is still an intentional matched section.
relocate = false
resize = false
priority = 30
program.name = "tool.exe"
window.title = "Tool Diagnostics"

# Exact and selector properties cannot be mixed.
# Regex/glob objects, old match_* keys, set_position, and set_size are rejected.
