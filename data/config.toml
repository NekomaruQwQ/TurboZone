#:schema config.schema.json

[[rules]]
name = "default"
move = true
resize.default = [2880, 1800]
priority = -1
window.min = [1920, 1200]

[[rules]]
name = "vscode"
move = true
resize.default = [2880, 1800]
program.name = "Code.exe"

[[rules]]
name = "edge"
move = true
resize.default = [2880, 1800]
program.name = "msedge.exe"

[[rules]]
name = "edge.chatgpt"
move = true
resize.default = [2560, 1600]
priority = 1
program.name = "msedge.exe"
window.title.contains = "ChatGPT"

[[rules]]
name = "edge.youtube-music"
move = true
resize.default = [2560, 1600]
priority = 1
program.name = "msedge.exe"
window.title.contains = "YouTube Music"

[[rules]]
name = "edge.lofi-engine"
move = true
resize.default = [2560, 1600]
priority = 1
program.name = "msedge.exe"
window.title.contains = "Lofi Engine"

[[rules]]
name = "explorer"
move = true
resize.default = [2880, 1800]
program.name = "explorer.exe"
window.title.ends_with = "File Explorer"

[[rules]]
name = "md.mclauncher"
move = true
resize.default = [1920, 1200]
window.title = "Minecraft Launcher"
