#:schema https://raw.githubusercontent.com/NekomaruQwQ/TurboZone/refs/heads/main/data/config.schema.json

# Sample configuration for TurboZone.

[[rules]]
name = "default"
move = true
resize.default = [2880, 1800]
priority = -1
window.min = [1920, 1200]

[[rules]]
name = "vscode"
move = true
resize.default = [2880, 1800]
program.name = "Code.exe"

[[rules]]
name = "edge"
move = true
resize.default = [2880, 1800]
program.name = "msedge.exe"

[[rules]]
name = "edge.chatgpt"
move = true
resize.default = [2560, 1600]
priority = 1
program.name = "msedge.exe"
window.title.contains = "ChatGPT"
